name: Daily Mandala Refresh

on:
  schedule:
    # 毎朝 6:00 JST = 21:00 UTC（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動実行も可能

# 同時実行を抑止（前日分が走ってる間は次を待つ）
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Stooq は Yahoo より安定しているが、~3,600 銘柄を控えめ並列で
    # 取得する想定なので 90 分を上限にする（実測 ~30〜45 分の見込み）
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh mandala data
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Stooq の許容範囲を尊重しつつ、3,589 銘柄を 1 時間内に終わらせる
          REFRESH_CONCURRENCY: '8'
          REFRESH_SLEEP_MS: '60'
          REFRESH_TIMEOUT_MS: '15000'
        run: npm run refresh

      - name: Summary
        if: always()
        run: |
          echo "## Refresh result" >> $GITHUB_STEP_SUMMARY
          echo "- Finished at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source: Stooq (https://stooq.com)" >> $GITHUB_STEP_SUMMARY
