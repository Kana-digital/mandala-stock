name: Daily Mandala Refresh

on:
  schedule:
    # 毎朝 6:00 JST = 21:00 UTC（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動実行も可能

# 同時実行を抑止（前日分が走ってる間は次を待つ）
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # J-Quants Free プランは bulk 取得 (BULK_PRICES=true) でも
    # 営業日ごとに 4 秒スリープ × ~250 営業日 + リトライで 130 分前後、
    # スコアリング込みで 150-165 分かかる。実測で 3h を超えるケースもあるため、
    # GitHub Actions Standard runner の上限 360 min の手前 350 min を設定。
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh mandala data
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # J-Quants V2 API Key（ダッシュボードで発行したもの）。変数名は互換のため REFRESH_TOKEN 名残
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
          # Free プランのレート制限は実測で「1.5秒/req では 429 を頻発」、
          # 各 429 は 10/20/40/80/160 秒の指数バックオフを誘発するため、
          # SLEEP_MS は 4000ms に引き上げて事実上 429 が出ない状態で回す。
          # jquants.ts 側で 429 を最大 5 回・指数バックオフ（最大 ~5 分待機）で
          # リトライするので、外側のタイムアウトはそれ以上に取る必要がある。
          REFRESH_CONCURRENCY: '1'
          REFRESH_SLEEP_MS: '4000'
          REFRESH_TIMEOUT_MS: '420000'
          # TOPIX 500 (Core30 + Large70 + Mid400) ~489 銘柄。
          # 'topix100' = Core30+Large70（軽量）, 'all' = 全銘柄
          SCALE_FILTER: 'topix500'
          # BULK_PRICES=true: /equities/bars/daily?date=... を営業日ごとに 1 回呼んで
          # 全銘柄の bar を一括取得する。銘柄ごとの per-stock 取得より req 数が大幅減。
          BULK_PRICES: 'true'
        run: npm run refresh

      - name: Summary
        if: always()
        run: |
          echo "## Refresh result" >> $GITHUB_STEP_SUMMARY
          echo "- Finished at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source: J-Quants V2 (https://api.jquants.com/v2)" >> $GITHUB_STEP_SUMMARY
