name: Daily Mandala Refresh

on:
  schedule:
    # 毎朝 6:00 JST = 21:00 UTC（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動実行も可能

# 同時実行を抑止（前日分が走ってる間は次を待つ）
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # J-Quants は GH IP からも通る公式 API。3,589 銘柄を控えめ並列で
    # 取得する想定で 90 分上限。実測 ~20〜35 分の見込み。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh mandala data
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # J-Quants V2 API Key（ダッシュボードで発行したもの）。変数名は互換のため REFRESH_TOKEN 名残
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
          # J-Quants V2 はおおむね寛容だが安全側で 3 並列・200ms スリープ
          REFRESH_CONCURRENCY: '3'
          REFRESH_SLEEP_MS: '200'
          REFRESH_TIMEOUT_MS: '20000'
        run: npm run refresh

      - name: Summary
        if: always()
        run: |
          echo "## Refresh result" >> $GITHUB_STEP_SUMMARY
          echo "- Finished at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source: J-Quants V2 (https://api.jquants.com/v2)" >> $GITHUB_STEP_SUMMARY
