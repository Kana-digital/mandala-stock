name: Daily Mandala Refresh

on:
  schedule:
    # 毎朝 6:00 JST = 21:00 UTC（前日）
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動実行も可能

# 同時実行を抑止（前日分が走ってる間は次を待つ）
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # J-Quants Free プランはレート制限が厳しく、3,589 銘柄を 1.5 秒間隔で
    # シーケンシャルに取得すると約 90 分。安全マージンとして 180 分上限。
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh mandala data
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # J-Quants V2 API Key（ダッシュボードで発行したもの）。変数名は互換のため REFRESH_TOKEN 名残
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
          # Free プランは 1 リクエスト/秒未満のレート制限あり。安全側で
          # シーケンシャル実行 + 1.5 秒間隔で 429 を回避。
          # jquants.ts 側で 429 を最大 5 回・指数バックオフ（最大 ~5 分待機）で
          # リトライするので、外側のタイムアウトはそれ以上に取る必要がある。
          REFRESH_CONCURRENCY: '1'
          REFRESH_SLEEP_MS: '1500'
          REFRESH_TIMEOUT_MS: '420000'
          # TOPIX 500 (Core30 + Large70 + Mid400) のみに絞る。
          # 全 3,589 銘柄を取得したい場合は 'all' に変更。
          SCALE_FILTER: 'topix500'
        run: npm run refresh

      - name: Summary
        if: always()
        run: |
          echo "## Refresh result" >> $GITHUB_STEP_SUMMARY
          echo "- Finished at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source: J-Quants V2 (https://api.jquants.com/v2)" >> $GITHUB_STEP_SUMMARY
