<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9C7E1F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 9マンダラ -->
  <g transform="translate(96 96)">
    <g fill="none" stroke="url(#gold)" stroke-width="6">
      <rect x="0"   y="0"   width="96" height="96" rx="14"/>
      <rect x="112" y="0"   width="96" height="96" rx="14"/>
      <rect x="224" y="0"   width="96" height="96" rx="14"/>
      <rect x="0"   y="112" width="96" height="96" rx="14"/>
      <rect x="224" y="112" width="96" height="96" rx="14"/>
      <rect x="0"   y="224" width="96" height="96" rx="14"/>
      <rect x="112" y="224" width="96" height="96" rx="14"/>
      <rect x="224" y="224" width="96" height="96" rx="14"/>
    </g>
    <!-- 中央セルは光る -->
    <rect x="112" y="112" width="96" height="96" rx="14" fill="url(#gold)"/>
    <text x="160" y="174" font-size="64" font-weight="bold" text-anchor="middle" fill="#0A0F1C" font-family="serif">和</text>
  </g>
</svg>
